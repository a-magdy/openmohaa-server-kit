version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week before proposing a new release (supply-chain safety).
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
