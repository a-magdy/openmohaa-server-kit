name: Check OpenMoHAA release

# Weekly: if upstream has a newer release than the one pinned in
# docker/Dockerfile, open a PR that bumps the version and sha256 values.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings. PRs opened with GITHUB_TOKEN do not start
# other workflows: close and reopen the PR (or push to it) to run Lint and Guard.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Keeps the token in .git/config on purpose: the last step pushes the
      # bump branch. Nothing in this job uploads artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Compare pinned and latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^ARG OPENMOHAA_VERSION=//p' docker/Dockerfile)
          release=$(gh api repos/openmoh/openmohaa/releases/latest)
          latest=$(jq -r .tag_name <<<"$release")
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected tag: $latest"; exit 1; }
          echo "pinned=$pinned latest=$latest"
          if [ "$pinned" = "$latest" ]; then
            echo "update=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          digest() {
            jq -r --arg n "openmohaa-$latest-linux-$1.zip" \
              '.assets[] | select(.name == $n) | .digest // empty' <<<"$release" | sed 's/^sha256://'
          }
          amd64=$(digest amd64)
          arm64=$(digest arm64)
          [[ "$amd64" =~ ^[0-9a-f]{64}$ && "$arm64" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "Release $latest has no sha256 digests for linux-amd64/arm64"; exit 1; }
          {
            echo "update=true"
            echo "pinned=$pinned"
            echo "latest=$latest"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >>"$GITHUB_OUTPUT"

      - name: Open bump PR
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
          AMD64: ${{ steps.check.outputs.amd64 }}
          ARM64: ${{ steps.check.outputs.arm64 }}
        run: |
          set -euo pipefail
          branch="bump/openmohaa-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists"
            exit 0
          fi
          sed -i \
            -e "s/^ARG OPENMOHAA_VERSION=.*/ARG OPENMOHAA_VERSION=$LATEST/" \
            -e "s/^ARG OPENMOHAA_SHA256_AMD64=.*/ARG OPENMOHAA_SHA256_AMD64=$AMD64/" \
            -e "s/^ARG OPENMOHAA_SHA256_ARM64=.*/ARG OPENMOHAA_SHA256_ARM64=$ARM64/" \
            docker/Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "build: bump OpenMoHAA to $LATEST"
          git push origin "$branch"
          gh pr create \
            --title "build: bump OpenMoHAA to $LATEST" \
            --body "Bumps OpenMoHAA from $PINNED to $LATEST with the sha256 digests GitHub reports for the release assets. Read the [release notes](https://github.com/openmoh/openmohaa/releases/tag/$LATEST) for breaking changes and test with your own game files before merging."
