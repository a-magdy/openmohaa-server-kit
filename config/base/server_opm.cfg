// Base server settings for openmohaa-server-kit.
//
// The entrypoint renders /data/home/main/server.cfg in this order:
//   1. this file
//   2. settings generated from .env (hostname, passwords, game type, limits, ...)
//   3. exec custom.cfg (from ./custom/custom.cfg, if present)
//   4. sv_maplist from MAP_ROTATION
//   5. map START_MAP (always last)
// Do not put sv_hostname, rconpassword, g_password, sv_maplist or map here:
// they come from .env. Put anything else you want to override in custom.cfg.

// ---- Slots ----
// Reserved slots for players who know sv_privatePassword; set both in custom.cfg.
set sv_privateclients 0

// ---- Game type ----
// 1 Free for All, 2 Team, 3 Round, 4 Objective, 5 Tug-of-War, 6 Liberation.
// GAME_TYPE in .env overrides this. After changing it over RCON, run
// `reloadmap` for it to take effect.
set g_gametype 1

// ---- Gameplay ----
// Killed players drop a health pack.
set g_healthdrop 1

// Movement speed multiplier (1 = original speed).
//set sv_dmspeedmult 1.1

// Friendly fire: 0 off, 1 on. TEAM_DAMAGE in .env overrides this.
set g_teamdamage 0

// Match limits; TIME_LIMIT, FRAG_LIMIT and ROUND_LIMIT in .env override them.
// timelimit: minutes per map (0 = none). fraglimit: score that ends the map.
// roundlimit: minutes per round in round-based modes (0 = none).
timelimit 10
fraglimit 100
roundlimit 0

// Seconds between team respawn waves (off by default: players respawn singly).
//set sv_team_spawn_interval 15

// Seconds of inactivity before a player is moved to spectator, then kicked.
set g_inactivespectate 60
set g_inactivekick 900

// List the server in the in-game browser. PUBLIC_LISTING in .env overrides this.
set sv_gamespy 1

// Throttle chat spam.
set sv_floodprotect 1

// Spectators can only follow their own team.
set g_forceteamspectate 1

// ---- dmflags ----
// Toggle one flag with `bitset dmflags <bit>` (on) or `bitset dmflags <bit> 0`
// (off), here, in custom.cfg or over RCON. The bits most servers use:
//   3  no falling damage
//   9  spawn as far from enemies as possible
//  14  infinite ammo
//  17  no footstep sounds
//  18  allow leaning while moving (Spearhead/Breakthrough behaviour)
//  22  no rifles          23  no sniper rifles   24  no SMGs
//  25  no machine guns    26  no rocket launchers
//  27  no shotguns        28  no landmines
// The full list of DF_* flags is in the OpenMoHAA source
// (https://github.com/openmoh/openmohaa).

// Allow leaning while moving on Spearhead and Breakthrough
bitset dmflags 18

// Seconds of spawn protection.
set sv_invulnerabletime 3

// Team kills before a warning, and before a kick.
set g_teamkillwarn 3
set g_teamkillkick 5

// Seconds a player must wait between team switches.
set g_teamswitchdelay 15

// Seconds into a round during which new players can still join it.
set g_allowjointime 30

// Words server browsers can filter on.
set sv_keywords "MOHAA Server"

// Ping limits for joining players (0 = no limit).
set sv_minping 0
set sv_maxping 800

// Bandwidth cap per client (0 = unlimited).
set sv_maxrate 0

// Allow sprinting.
sv_sprinton 1
//sv_runspeed 250 // spearhead runspeed is 287

// -------------- Players and Bot tweaks --------------

// https://github.com/openmoh/openmohaa/blob/main/docs/markdown/03-configuration/01-configuration.md#bots

// Max total number of players (clients and bots) cannot exceed 64

set sv_maxclients 24 // Maximum number of clients that can connect to the server
set sv_maxbots 40 // Maximum number of bots

