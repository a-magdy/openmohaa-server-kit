// Base server settings for openmohaa-server-kit.
//
// The entrypoint renders /data/home/main/server.cfg in this order:
//   1. this file
//   2. settings generated from .env (hostname, passwords, game type, limits, ...)
//   3. exec custom.cfg (from ./custom/custom.cfg, if present)
//   4. sv_maplist from MAP_ROTATION
//   5. map START_MAP (always last)
// Do not put sv_hostname, rconpassword, g_password, sv_maplist or map here:
// they come from .env. Put anything else you want to override in custom.cfg.

// Private Clients
// Slots reserved for players who know sv_privatePassword. Set both in custom.cfg.
set sv_privateclients 0

// Game Type
// 1 Free for All
// 2 Team Based
// 3 Round Based
// 4 Objective
// 5 Tug-of-War
// 6 Liberation
// Note: Run `reloadmap` after a g_gametype change to take effect
set g_gametype 1


// Health Drop
// When enabled players will drop a health pack when killed
set g_healthdrop 1

// Fast Run Speed
// When checked, the speed at which players can run through levels is increased.
// Leaving it unchecked defaults to Medal of Honor Allied Assault original run speed
//set sv_dmspeedmult 1.100000

// Team Damage
// Toggles friendly fire
set g_teamdamage 0

// Time Limit
// This sets the elapsed time at which the game ends, the winner being the player with the highest score at that time.
timelimit 10

// Frag Limit
// The score at which the player or team will win the current map.
fraglimit 100

// Team Spawn Delay
// This sets a delay in seconds between spawns. This is useful if you would like the
// player spawned in batches, rather than one at a time
//set sv_team_spawn_interval 15

// Round Reset Time
// This sets how long each round will take, in minutes. This can be smaller than the map rotation time, but not larger.
roundlimit 0

// Inactive Spectate
// This sets the time in seconds after which an inactive player becomes a spectator. To save server bandwidth, 60 seconds is default.
set g_inactivespectate 60

// Inactive Kick
// This sets the time in seconds after which an inactive player is kicked out of the game. 900 (15 minutes) seconds is default.
set g_inactivekick 900

// Use Gamespy
// To use GameSpy gaming service for internet-based multiplayer games.
// If this is 0, players will not be able to see your server via the in-game browser nor gamespy arcade.
set sv_gamespy 1

// Flood Protect
// Limits amount of text a player can type
set sv_floodprotect 1

// Forces players to only be able to spectate behind their own team.
set g_forceteamspectate 1

//  dmflags -- flags that can be set in the dmflags variable.
// DF_NO_HEALTH              (1 << 0) // Players do not get health pickups, health stays fixed.
// DF_NO_POWERUPS            (1 << 1) // Disables powerups (like quad damage, etc.) from spawning or being usable.
// DF_WEAPONS_STAY           (1 << 2) // Weapons stay when you die instead of dropping (you keep them in inventory).
// DF_NO_FALLING             (1 << 3) // Negates fall damage — players won’t take damage from drops.
// DF_INSTANT_ITEMS          (1 << 4) // Items (health/armor/pickups) respawn instantly (no delay).
// DF_SAME_LEVEL             (1 << 5) // Forces matches to stay on the same map (prevents map rotation or change).
// DF_SKINTEAMS              (1 << 6) // Team assignment is done by skin (players with the same skin are considered on the same team).
// DF_MODELTEAMS             (1 << 7) // Team assignment based on model. Similar to SKINTEAMS but uses player model.
// DF_FRIENDLY_FIRE          (1 << 8) // Enables damage between teammates (you can hurt/kill your own team).
// DF_SPAWN_FARTHEST         (1 << 9) // Players (or bots) spawn as far away as possible from enemies.
// DF_FORCE_RESPAWN          (1 << 10) // Forces players to respawn immediately when they die (no waiting).
// DF_NO_ARMOR               (1 << 11) // Disables armor pickups / armor has no effect.
// DF_FAST_WEAPONS           (1 << 12) // Weapon switching and/or firing happens faster (speeded-up weapon behavior).
// DF_NOEXIT                 (1 << 13) // Prevents exiting a level by normal means (used in campaign or controlled flows).
// DF_INFINITE_AMMO          (1 << 14) // Gives players unlimited ammo (they don’t consume it).
// DF_FIXED_FOV              (1 << 15) // Fixes the field of view — prevents players from changing FOV dynamically.
// DF_NO_DROP_WEAPONS        (1 << 16) // Weapons cannot be dropped on death or manually.
// DF_NO_FOOTSTEPS           (1 << 17) // Footstep sounds are disabled (silent movement).
// DF_ALLOW_LEAN_MOVEMENT    (1 << 18) // Enables lean/peek movement if the client supports it.
// DF_OLD_SNIPER             (1 << 19) // Uses legacy sniper behavior (probably older-specified mechanics/feel).
// DF_DISALLOW_KAR98_MORTAR  (1 << 20) // Disables use of the Kar98’s mortar-like functionality (or prevents its special use).
// DF_WEAPON_LANDMINE_ALWAYS (1 << 21) // Forces landmine weapon behavior to always be active or available (mod-specific tweak).
// DF_WEAPON_NO_RIFLE        (1 << 22) // Disables rifles from being usable or spawning.
// DF_WEAPON_NO_SNIPER       (1 << 23) // Disables sniper rifles.
// DF_WEAPON_NO_SMG          (1 << 24) // Disables submachine guns.
// DF_WEAPON_NO_MG           (1 << 25) // Disables machine guns.
// DF_WEAPON_NO_ROCKET       (1 << 26) // Disables rocket launchers.
// DF_WEAPON_NO_SHOTGUN      (1 << 27) // Disables shotguns.
// DF_WEAPON_NO_LANDMINE     (1 << 28) // Disables landmines.

// Allow leaning while moving on Spearhead and Breakthrough
bitset dmflags 18

// Invulnerable Time
// Amount of time (in seconds) a player is invulnerable for after spawning (default=3 seconds)
set sv_invulnerabletime 3

// Team Kill Warning
// Amount of team kills before the player is warned
set g_teamkillwarn 3

// Team Kill Kick
// Amount of team kills before the player is kicked off the server.
set g_teamkillkick 5

// Team Switch Delay
// Frequency at which you can switch teams
set g_teamswitchdelay 15

// Allow Join Time
set g_allowjointime 30

// Keywords
// Keywords which allow browsers to filter servers.
set sv_keywords "MOHAA Server"

// Minimum Ping to allow clients to join with.  0 means anyone
set sv_minping 0

// Maximum Ping to allow clients to join with.  0 means anyone
set sv_maxping 800

// Maximum Rate
// 0 = unlimited
set sv_maxrate 0

// Whether or not to allow sprinting
sv_sprinton 1
//sv_runspeed 250 // spearhead runspeed is 287

// -------------- Players and Bot tweaks --------------

// https://github.com/openmoh/openmohaa/blob/main/docs/markdown/03-configuration/01-configuration.md#bots

// Max total number of players (clients and bots) cannot exceed 64

set sv_maxclients 24 // Maximum number of clients that can connect to the server
set sv_maxbots 40 // Maximum number of bots

