// Prints a command cheat sheet to all players. Run with: rcon exec help.cfg
say "========================================="
say "  SERVER COMMANDS (RCON)"
say "========================================="
say ""
say "--- Bot Management ---"
say "  rcon addbot 1 <name>     Add a bot"
say "  rcon removebot <number>  Remove bots"
say "  rcon exec bots.cfg       Load bot preset"
say ""
say "--- Game Settings ---"
say "  rcon fraglimit <score>   Set score limit"
say "  rcon timelimit <mins>    Set time limit"
say "  rcon set g_gametype <n>  1=FFA, 2=Teams"
say "  rcon reloadmap           Apply changes"
say ""
say "--- Map Commands ---"
say "  rcon map <name>          Change map"
say "  Stock maps: dm/mohdm1 ... dm/mohdm7"
say ""
say "--- Weapon Flags ---"
say "  rcon bitset dmflags <n>  Toggle weapon"
say "  14=ammo 22=rifle 23=sniper 24=smg"
say "  25=mg 26=rocket 27=shotgun"
say "  Add 0 to re-enable: rcon bitset dmflags 26 0"
say ""
say "========================================="
